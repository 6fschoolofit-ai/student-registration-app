<CodeBlock language="html" editable>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Registration</title>
<style>
* {
box-sizing: border-box;
}
body {
margin: 0;
padding: 30px 15px;
font-family: Arial, sans-serif;
background: #eef2f7;
color: #1e293b;
}
.container {
max-width: 480px;
margin: 30px auto;
padding: 30px;
background: white;
border-radius: 12px;
box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
}
h1 {
text-align: center;
color: #0f766e;
}
p {
line-height: 1.5;
}
label {
display: block;
margin-top: 18px;
font-weight: bold;
}
input, select {
width: 100%;
padding: 12px;
margin-top: 7px;
border: 1px solid #cbd5e1;
border-radius: 6px;
font-size: 15px;
}
button {
width: 100%;
padding: 13px;
margin-top: 25px;
border: none;
border-radius: 6px;
background: #0f766e;
color: white;
font-size: 16px;
font-weight: bold;
cursor: pointer;
}
button:hover {
background: #115e59;
}
.success {
padding: 12px;
background: #dcfce7;
color: #166534;
border-radius: 6px;
}
.error {
padding: 12px;
background: #fee2e2;
color: #991b1b;
border-radius: 6px;
}
</style>
</head>

<body>

<div class="container">

<h1>Student Registration</h1>
<p>Register for your preferred course by entering your details below.</p>
{% if success %}
<p class="success" role="status">{{ success }}</p>
{% endif %}
{% if error %}
<p class="error" role="alert">{{ error }}</p>
{% endif %}
<form method="POST" action="/">
<label for="name">Student Name</label>
<input
            type="text"
            id="name"
            name="name"
            maxlength="100"
            required
        >
<label for="email">Email ID</label>
<input
            type="email"
            id="email"
            name="email"
            maxlength="254"
            required
        >
<label for="phone">Phone Number</label>
<input
            type="tel"
            id="phone"
            name="phone"
            maxlength="20"
            required
        >
<label for="course">Select Course</label>
<select id="course" name="course" required>
<option value="">-- Choose a course --</option>
{% for course in courses %}
<option value="{{ course }}">{{ course }}</option>
{% endfor %}
</select>
<button type="submit">Submit Registration</button>
</form>
</div>

</body>
</html>
</CodeBlock>
